<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin Login | Diwyashakthi Wedamedura</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="admin.css"></head><body><main class="login-page"><section class="login-card"><img class="login-logo" src="assets/logo.svg" alt="Diwyashakthi Wedamedura"><h1>Super Admin Access</h1><p>Diwyashakthi Wedamedura secure website control centre</p><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn gold" style="width:100%" type="submit">Sign In</button><div id="loginStatus" class="status"></div></form><div class="setup-box"><button id="showSetup" class="btn ghost" type="button" style="width:100%">Initial Super Admin Setup</button><form id="setupForm" class="hidden" style="margin-top:16px"><div class="field"><label>Display name</label><input id="setupName" value="Super Admin" required></div><div class="field"><label>Email</label><input id="setupEmail" type="email" required></div><div class="field"><label>Password</label><input id="setupPassword" type="password" minlength="10" required></div><div class="field"><label>One-time setup code</label><input id="setupCode" type="password" required></div><button class="btn" style="width:100%" type="submit">Create Super Admin</button><div id="setupStatus" class="status"></div></form><p class="tiny">Initial setup works only before the first Super Admin account exists.</p></div><p class="tiny" style="text-align:center;margin-top:18px"><a href="index.html">← Back to website</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://caxbhzgmwkhgdblotjvs.supabase.co',SB_KEY='sb_publishable_p6qXdrM6TF0ZW7Z5btj5jQ_-WP-ou6N';const sb=supabase.createClient(SB_URL,SB_KEY),qs=id=>document.getElementById(id);qs('showSetup').onclick=()=>qs('setupForm').classList.toggle('hidden');sb.auth.getSession().then(async({data})=>{if(data.session){const{data:p}=await sb.from('profiles').select('role,is_active').eq('id',data.session.user.id).single();if(p?.is_active&&p.role==='super_admin')location.href='admin.html'}});qs('loginForm').onsubmit=async e=>{e.preventDefault();qs('loginStatus').textContent='Signing in…';const{data,error}=await sb.auth.signInWithPassword({email:qs('loginEmail').value.trim(),password:qs('loginPassword').value});if(error){qs('loginStatus').textContent=error.message;return}const{data:p}=await sb.from('profiles').select('role,is_active').eq('id',data.user.id).single();if(!p?.is_active||p.role!=='super_admin'){await sb.auth.signOut();qs('loginStatus').textContent='Super Admin access only.';return}location.href='admin.html'};qs('setupForm').onsubmit=async e=>{e.preventDefault();qs('setupStatus').textContent='Creating Super Admin…';try{const r=await fetch(SB_URL+'/functions/v1/bootstrap-superadmin',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({display_name:qs('setupName').value.trim(),email:qs('setupEmail').value.trim(),password:qs('setupPassword').value,code:qs('setupCode').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Setup failed');qs('setupStatus').textContent='Super Admin created. You can sign in now.';qs('loginEmail').value=qs('setupEmail').value;qs('setupPassword').value='';qs('setupCode').value=''}catch(err){qs('setupStatus').textContent=err.message}};</script></body></html>
